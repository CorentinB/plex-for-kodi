<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PM4K Kodi UI Preview</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="workspace">
      <section class="preview-panel" aria-label="Kodi UI preview">
        <div class="preview-toolbar">
          <div>
            <h1>PM4K Home Preview</h1>
            <p><span class="native-dot" aria-hidden="true"></span>Native XML is authoritative · HTML mirrors the proven composition</p>
          </div>
          <div class="toolbar-controls" aria-label="Preview controls">
            <button class="tool-button is-active" data-scale="fit" type="button">Fit</button>
            <button class="tool-button" data-scale="100" type="button">100%</button>
            <button class="tool-button" data-scale="75" type="button">75%</button>
            <button class="tool-button" id="toggle-lines" type="button">Lines</button>
            <button class="tool-button is-active" id="toggle-bg" type="button">Art</button>
          </div>
        </div>

        <div class="stage-shell" id="stage-shell">
          <div class="kodi-stage" id="kodi-stage" data-lines="false" data-art="true" data-hub-index="0">
            <div class="backdrop" aria-hidden="true"></div>
            <aside class="left-rail" aria-label="Quick navigation">
              <div class="avatar">CB</div>
              <button class="rail-button" type="button" aria-label="Search"><img src="/skin-media/script.plex/buttons/search.png" alt=""></button>
            </aside>
            <header class="kodi-header">
              <nav class="section-strip" aria-label="Library sections"></nav>
              <img class="plex-logo" src="/skin-media/script.plex/home/plex.png" alt="Plex">
            </header>
            <section class="hero-panel" aria-label="Selected media">
              <h1 data-hero-title></h1>
              <p class="hero-meta" data-hero-meta></p>
              <p class="hero-summary" data-hero-summary></p>
            </section>
            <section class="hub-stack" aria-label="Home hubs"></section>
            <div class="row-top-scrim" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <aside class="source-panel" aria-label="Source templates">
        <div class="source-header">
          <h2>Source Map</h2>
          <p>Read-only view of the Kodi templates represented by this approximation.</p>
        </div>
        <div class="source-list" id="source-list"></div>
        <pre class="source-excerpt" id="source-excerpt">Loading templates...</pre>
      </aside>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
